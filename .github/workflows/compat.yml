name: Hermes Compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 03:00 UTC — PRD §140 scheduled compatibility job.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: Hermes latest-release
    # PRD §140: the weekly schedule runs the current-main cell only (the
    # drift detector); latest-release runs on push/PR.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --group dev
      # Hermes goes into a DEDICATED venv, not the project .venv:
      # test_stock_hermes_unchanged.py snapshots the install tree and its
      # ignore list excludes any path containing `.venv` — pointing
      # HERMES_AGENT_DIR at the project venv's site-packages yields an empty
      # snapshot and a hard failure instead of a meaningful comparison.
      - name: Install Hermes (latest release)
        run: |
          uv venv /tmp/hermes-agent-venv
          uv pip install --python /tmp/hermes-agent-venv/bin/python hermes-agent
      # HERMES_AGENT_DIR must point at the installed hermes tree so
      # packages/hermes-plugin/tests/test_stock_hermes_unchanged.py RUNS
      # (it skips when the tree is absent) — site-packages is the install
      # root: dirname(dirname(hermes_cli/__init__.py)).
      - name: Locate Hermes install
        id: hermes-dir
        run: |
          hermes_dir="$(/tmp/hermes-agent-venv/bin/python -c 'import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))')"
          echo "dir=$hermes_dir" >> "$GITHUB_OUTPUT"
      - name: Verify plugin entry-point group
        run: /tmp/hermes-agent-venv/bin/python -c "from hermes_cli.plugins import ENTRY_POINTS_GROUP; assert ENTRY_POINTS_GROUP=='hermes_agent.plugins', ENTRY_POINTS_GROUP"
      - name: Run hermes-plugin tests against installed Hermes
        env:
          HERMES_AGENT_DIR: ${{ steps.hermes-dir.outputs.dir }}
        run: uv run --group dev pytest packages/hermes-plugin/tests -q

  current-main:
    name: Hermes current-main
    # PRD §140 drift detector: runs on PRs, the weekly cron, and manual
    # dispatch — NOT on push. An upstream hermes-main breakage (as of
    # 2026-08-13: hermes_cli.plugins imports registration_lifecycle, missing
    # from hermes main's own pyproject py-modules) must never block the push
    # fast-gate; the scheduled run surfaces it weekly.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --group dev
      # current-main needs an editable install: hermes-agent's build backend
      # refuses wheel/sdist builds by design (shell installer / Docker / Nix
      # only) and directs dev installs to `uv pip install -e`.
      - name: Install Hermes (current main)
        run: |
          uv venv /tmp/hermes-agent-venv
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent-src
          uv pip install --python /tmp/hermes-agent-venv/bin/python -e /tmp/hermes-agent-src
      # Editable install: hermes_cli.__file__ lives in the source checkout,
      # so HERMES_AGENT_DIR is the clone root — the stock-unchanged test
      # snapshots the hermes source tree itself.
      - name: Locate Hermes install
        id: hermes-dir
        run: |
          hermes_dir="$(/tmp/hermes-agent-venv/bin/python -c 'import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))')"
          echo "dir=$hermes_dir" >> "$GITHUB_OUTPUT"
      - name: Verify plugin entry-point group
        run: /tmp/hermes-agent-venv/bin/python -c "from hermes_cli.plugins import ENTRY_POINTS_GROUP; assert ENTRY_POINTS_GROUP=='hermes_agent.plugins', ENTRY_POINTS_GROUP"
      - name: Run hermes-plugin tests against installed Hermes
        env:
          HERMES_AGENT_DIR: ${{ steps.hermes-dir.outputs.dir }}
        run: uv run --group dev pytest packages/hermes-plugin/tests -q
