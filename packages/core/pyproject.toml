[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachepilot_core"]

[project]
name = "cachepilot-core"
version = "0.1.0"
description = "CachePilot core — canonical request identity, two fingerprints, usage normalization, fake provider cache simulator, economic controller (Phase 0 research harness)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
]
