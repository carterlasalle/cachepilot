[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachepilot_hermes"]

[project]
name = "cachepilot-hermes-plugin"
version = "0.1.0"
description = "CachePilot Hermes plugin — external plugin skeleton: pass-through middleware + lifecycle hooks with structured debug logs; CI test asserts stock Hermes unchanged (PRD Phase 1)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

# Hermes discovers pip-installed plugins via this entry-point group
# (hermes_cli/plugins.py::ENTRY_POINTS_GROUP). The value is a module whose
# `register(ctx)` is invoked by PluginManager._load_plugin.
[project.entry-points."hermes_agent.plugins"]
cachepilot-hermes-plugin = "cachepilot_hermes.plugin"
