[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachepilot_relay"]

[project]
name = "cachepilot-relay"
version = "0.1.0"
description = "CachePilot relay — cachepilotd, a small local provider relay: 100% pass-through, 0 cache modification (PRD Phase 3)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "cachepilot-core>=0.1.0",
]

[project.scripts]
cachepilotd = "cachepilot_relay.server:main"
