[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cachepilot_cli"]

[project]
name = "cachepilot-cli"
version = "0.1.0"
description = "CachePilot CLI — cachepilot status/leases/costs observability (PRD §76-79, Phase 4)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "cachepilot-core>=0.1.0",
    "cachepilot-relay>=0.1.0",
]

[project.scripts]
cachepilot = "cachepilot_cli.main:main"
